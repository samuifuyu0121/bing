<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>神巾冰｜冷笑話降溫中</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><div class="scene" id="scene"><header><button class="back" id="back" aria-label="返回">‹</button><span class="brand" id="brand">涼感濕紙巾</span><button class="hamburger" id="menuButton" aria-label="開啟選單">☰</button></header><section class="home" id="home"><div class="hero"><img class="hero-art" src="./hero-title.webp" alt="神巾冰品牌主視覺"><div class="side left">涼感濕紙巾</div><div class="side right">不好笑沒關係<br>夠冷就行</div></div><div class="bottom"><p>熱到當機？<br><strong>讓笑話冷靜一夏！</strong></p><button class="primary" id="generate">生 成 冷 笑 話 <span>❄</span></button><small>SCROLL TO COOL DOWN ↓</small></div></section><section class="generated hidden" id="generated"><div class="gen-label">COOLING SYSTEM / RANDOM JOKE</div><div class="gen-card"><span class="gen-snow">❄</span><h1 id="genQuestion"></h1><div class="gen-divider"></div><p id="genAnswer"></p></div><div class="gen-controls"><button id="regen">再生成一個 ❄</button><button id="genHome">返回首頁</button></div></section><section class="joke hidden" id="joke"><div class="joke-bg">涼</div><div class="joke-content"><span class="eyebrow">COLD JOKE / <span id="count">01</span></span><h1 id="question"></h1><div class="dots">·<br>·<br>·<br>·<br>·<br>·</div><p class="answer" id="answer">點擊下方揭曉答案</p></div><div class="joke-actions"><p>不夠涼嗎？再換一個笑話</p><div class="action-row"><button class="heart" id="like" aria-label="收藏">♡</button><button class="share" id="reveal">揭曉答案</button><button class="next" id="next" aria-label="下一則">→</button></div></div></section><div class="overlay hidden" id="overlay"></div><nav class="drawer" id="drawer" aria-label="網站目錄"><button class="drawer-close" id="close" aria-label="關閉選單">×</button><div class="drawer-line" aria-hidden="true"></div><div class="drawer-links"><button data-soon="活動資訊">活
